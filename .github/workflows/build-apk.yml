name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache: true

      - name: Create debug keystore
        run: |
          rm -f "$GITHUB_WORKSPACE/debug.keystore"

          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Checking keystore..."
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android

      - name: Clean Gradle cache
        run: |
          rm -rf .gradle/configuration-cache
          rm -rf ~/.gradle/caches/configuration-cache

      - name: Build APK
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
